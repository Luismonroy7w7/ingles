eat(2,1fr);gap:20px;align-items:end;height:190px;padding:18px 10px 0;border-bottom:1px solid var(--line)}.bar-group{height:100%;display:grid;grid-template-rows:1fr auto;gap:8px;text-align:center;font-size:.78rem;color:var(--muted)}.bar{align-self:end;min-height:5px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--primary2),var(--primary));transition:height .6s}.bar.error{background:linear-gradient(180deg,#ff8995,var(--bad))}.chart-legend{display:flex;gap:16px;margin-top:14px;color:var(--muted);font-size:.83rem}.chart-legend b{color:var(--text)}.achievement-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.achievement{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}.achievement.locked{filter:grayscale(1);opacity:.55}.achievement b,.achievement small{display:block}.achievement small{color:var(--muted);margin-top:3px}.danger{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));padding:11px 14px;border-radius:9px;font-weight:800}@keyframes pop{50%{transform:scale(1.025)}}@media(max-width:780px){.app{display:block}.sidebar{position:fixed;left:0;transform:translateX(-105%);width:min(300px,85vw);transition:transform .25s;box-shadow:var(--shadow)}.sidebar.open{transform:none}.mobile-backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}.menu-btn{display:grid;place-items:center}.topbar{height:64px}.hero{align-items:flex-start}.lesson-icon{width:62px;height:62px;border-radius:14px;font-size:2rem}.content{padding-bottom:42px}.complete-row{align-items:flex-start;flex-direction:column}.match-grid{font-size:.92rem}.stats-grid{grid-template-columns:1fr}.home-hero{padding:28px 23px}}@media(max-width:430px){.progress-label{display:none}.hero h1{font-size:2rem}.options{grid-template-columns:1fr}.input-row .primary{width:100%}.profile-header{align-items:flex-start;flex-direction:column}}

const lessons=[
{icon:'🔤',title:'El alfabeto',intro:'El inglés usa las mismas 26 letras que el español, pero sus nombres se pronuncian diferente.',note:'Aprende primero el nombre de cada letra. Te ayudará a deletrear nombres, correos y palabras nuevas.',cards:[['A a','ei','a'],['B b','bi','be'],['C c','si','ce'],['D d','di','de'],['E e','i','e'],['F f','ef','efe'],['G g','yi','ge'],['H h','eich','hache'],['I i','ai','i'],['J j','yei','jota'],['K k','kei','ka'],['L l','el','ele'],['M m','em','eme'],['N n','en','ene'],['O o','ou','o'],['P p','pi','pe'],['Q q','kiu','cu'],['R r','ar','erre'],['S s','es','ese'],['T t','ti','te'],['U u','iu','u'],['V v','vi','uve'],['W w','dábol-iu','doble u'],['X x','eks','equis'],['Y y','uai','i griega'],['Z z','zi (EE.UU.)','zeta']],examples:[['My name is Ana.','mai neim is Ana','Me llamo Ana.'],['How do you spell it?','jau du yu espél it','¿Cómo se deletrea?']],exercise:{type:'choice',q:'¿Cómo se pronuncia la letra “H”?',options:['eich','hache','aitch'],answer:0,why:'H se dice “eich” en inglés.'}},
{icon:'🔊',title:'Pronunciación básica',intro:'No necesitas sonar perfecto. Empieza escuchando, repitiendo y usando una pronunciación aproximada.',note:'En inglés, una misma letra puede tener sonidos distintos. La pronunciación escrita aquí es una ayuda para hispanohablantes, no una regla exacta.',cards:[['th (think)','z suave con lengua entre dientes','pensar'],['th (this)','d suave con lengua entre dientes','esto'],['sh (she)','sh','ella'],['ch (chair)','ch','silla'],['j (job)','y fuerte','trabajo']],examples:[['Thank you.','zank yu','Gracias.'],['She is my friend.','shi is mai frend','Ella es mi amiga.']],exercise:{type:'choice',q:'¿Qué sonido aproximado tiene “sh” en she?',options:['ch','sh','s'],answer:1,why:'she se aproxima como “shi”.'}},
{icon:'🅰️',title:'Vocales',intro:'Las vocales inglesas pueden ser cortas o largas. Practicarlas cambia el significado de las palabras.',note:'Escucha la diferencia entre vocal corta y larga: ship ≠ sheep.',cards:[['a','ei / a corta','name / cat'],['e','i / e corta','he / bed'],['i','ai / i corta','time / sit'],['o','ou / o corta','go / hot'],['u','iu / a corta','use / cup']],examples:[['I see a green tree.','ai si a grin tri','Veo un árbol verde.'],['The cat is big.','de cat is big','El gato es grande.']],exercise:{type:'fill',q:'Completa: “sheep” se pronuncia aproximadamente',answer:'shiip',hint:'Piensa en “shiip” (i larga).'}},
{icon:'👋',title:'Saludos',intro:'Los saludos son la puerta de entrada a una conversación. Elige uno según el momento del día.',note:'Hello sirve casi siempre. Hi es más informal.',cards:[['Hello!','jelóu','¡Hola!'],['Good morning','gud mórnin','Buenos días'],['Good afternoon','gud afternún','Buenas tardes'],['Good evening','gud ívning','Buenas noches (al llegar)'],['Good night','gud náit','Buenas noches (al despedirse)'],['See you later!','si yu léiter','¡Nos vemos luego!']],examples:[['Hello, Maria!','jelóu, María','¡Hola, María!'],['Good morning. How are you?','gud mórnin. jau ar yu','Buenos días. ¿Cómo estás?']],exercise:{type:'match',q:'Relaciona cada saludo con su traducción.',pairs:[['Good night','Buenas noches (despedida)'],['Good morning','Buenos días'],['See you later','Nos vemos luego']]}},
{icon:'🙋',title:'Presentaciones',intro:'Para decir quién eres, usa “My name is…” o “I am…”. Para preguntar, usa “What is your name?”',note:'En conversaciones informales puedes decir: “I’m Ana.”',cards:[['My name is Carlos.','mai neim is Carlos','Me llamo Carlos.'],['I am Laura.','ai am Laura','Soy Laura.'],['What is your name?','juat is yor neim','¿Cuál es tu nombre?'],['Nice to meet you.','nais tu mit yu','Mucho gusto.']],examples:[['Hi, I am Diego.','jai, ai am Diego','Hola, soy Diego.'],['Nice to meet you too.','nais tu mit yu tu','Mucho gusto también.']],exercise:{type:'words',q:'Ordena para presentarte:',words:['am','I','Sofía'],answer:['I','am','Sofía']}},
{icon:'🔢',title:'Números',intro:'Domina primero del cero al veinte. Los números aparecen en edades, teléfonos, precios y horarios.',note:'En 13–19 termina en “teen”. Las decenas terminan en “ty”: twenty, thirty…',cards:[['zero – five','zírou, uan, tu, zri, for, faiv','0–5'],['six – ten','siks, séven, éit, náin, ten','6–10'],['eleven – fifteen','iléven, tuélv, zértin, fórtin, fíftin','11–15'],['sixteen – twenty','sikstín, séventin, éitin, náintin, tuénti','16–20']],examples:[['I am ten years old.','ai am ten yirs old','Tengo diez años.'],['My number is five.','mai námber is faiv','Mi número es cinco.']],exercise:{type:'choice',q:'¿Qué número es “eight”?',options:['6','8','18'],answer:1,why:'eight = ocho.'}},
{icon:'🎨',title:'Colores',intro:'Los colores describen objetos y van antes del sustantivo: a red car.',note:'En inglés los colores no cambian por género ni por plural.',cards:[['red','red','rojo'],['blue','blu','azul'],['yellow','yélou','amarillo'],['green','grin','verde'],['black','blak','negro'],['white','juait','blanco'],['orange','órinch','naranja'],['purple','pérpol','morado']],examples:[['It is a blue car.','it is a blu car','Es un coche azul.'],['The apple is red.','di ápol is red','La manzana es roja.']],exercise:{type:'fill',q:'Traduce al inglés: “verde”',answer:'green',hint:'Empieza con g.'}},
{icon:'📅',title:'Días',intro:'Los días de la semana se escriben con mayúscula inicial en inglés.',note:'Usa “on” antes de un día: on Monday = el lunes.',cards:[['Monday','mándei','lunes'],['Tuesday','tiúsdei','martes'],['Wednesday','uénsdei','miércoles'],['Thursday','zérsdei','jueves'],['Friday','fráidei','viernes'],['Saturday','sáterdei','sábado'],['Sunday','sándei','domingo']],examples:[['Today is Monday.','tudéi is mándei','Hoy es lunes.'],['See you on Friday!','si yu on fráidei','¡Nos vemos el viernes!']],exercise:{type:'choice',q:'¿Cuál es “miércoles”?',options:['Tuesday','Wednesday','Thursday'],answer:1,why:'Wednesday = miércoles.'}},
{icon:'🗓️',title:'Meses',intro:'Los meses también empiezan con mayúscula. Muchos se parecen al español; observa su pronunciación.',note:'Usa “in” con meses: in July = en julio.',cards:[['January','yániuéri','enero'],['February','fébruéri','febrero'],['March','march','marzo'],['April','éiprol','abril'],['May','mei','mayo'],['June / July','yun / yulái','junio / julio'],['August','ógost','agosto'],['September','septémber','septiembre'],['October','októuber','octubre'],['November','nouvémber','noviembre'],['December','disémber','diciembre']],examples:[['My birthday is in May.','mai bérzdei is in mei','Mi cumpleaños es en mayo.'],['December is a month.','disémber is a manz','Diciembre es un mes.']],exercise:{type:'fill',q:'Completa: “abril” en inglés es',answer:'april',hint:'Empieza con A.'}},
{icon:'🧑‍🤝‍🧑',title:'Pronombres personales',intro:'Los pronombres sustituyen nombres. Son fundamentales para construir frases con el verbo to be.',note:'It se usa para cosas, animales cuando no especificamos sexo, lugares o ideas.',cards:[['I','ai','yo'],['You','yu','tú / usted / ustedes'],['He','ji','él'],['She','shi','ella'],['It','it','eso / ello'],['We','wi','nosotros/as'],['They','dei','ellos/as']],examples:[['She is Ana.','shi is Ana','Ella es Ana.'],['They are students.','dei ar stúdents','Ellos son estudiantes.']],exercise:{type:'match',q:'Relaciona el pronombre con su significado.',pairs:[['We','nosotros/as'],['He','él'],['It','eso / ello']]}},
{icon:'⭐',title:'Verbo TO BE',intro:'To be significa ser o estar. Es la pieza central de tus primeras frases en inglés.',note:'No omitas el verbo: en inglés “Ella feliz” necesita “She is happy”.',toBe:true,cards:[['I am','ai am','yo soy / estoy'],['You are','yu ar','tú eres / estás'],['He is','ji is','él es / está'],['She is','shi is','ella es / está'],['It is','it is','eso es / está'],['We are','wi ar','nosotros somos / estamos'],['They are','dei ar','ellos son / están']],examples:[['I am happy.','ai am jápi','Estoy feliz.'],['You are my friend.','yu ar mai frend','Tú eres mi amigo/a.'],['He is a teacher.','ji is a tícher','Él es profesor.'],['She is at home.','shi is at jóm','Ella está en casa.'],['It is blue.','it is blu','Es azul.'],['We are ready.','wi ar rédi','Estamos listos.'],['They are students.','dei ar stúdents','Ellos son estudiantes.']],exercise:{type:'choice',q:'Completa: “She ___ my friend.”',options:['am','is','are'],answer:1,why:'Con she usamos is.'}},
{icon:'🧩',title:'Artículos: a, an, the',intro:'A y an significan “un/una” para algo no específico. The significa “el/la/los/las” para algo específico.',note:'Usa an antes de sonido vocal: an apple, an orange. No importa solo la letra: an hour (la h no suena).',cards:[['a book','a buk','un libro'],['an apple','an ápol','una manzana'],['the book','de buk','el libro (específico)'],['the apple','di ápol','la manzana (específica)']],examples:[['I am a student.','ai am a stúdent','Soy estudiante.'],['It is an orange.','it is an órinch','Es una naranja.'],['The car is red.','de car is red','El coche es rojo.']],exercise:{type:'choice',q:'Elige: “___ apple”',options:['a','an','the'],answer:1,why:'apple comienza con sonido vocal, por eso usamos an.'}},
{icon:'📦',title:'Sustantivos',intro:'Los sustantivos nombran personas, lugares, cosas o ideas: teacher, city, book, love.',note:'Los nombres propios siempre llevan mayúscula: Mexico, Ana, Monday.',cards:[['person','pérson','persona'],['teacher','tícher','profesor/a'],['book','buk','libro'],['house','jaus','casa'],['city','síti','ciudad'],['friend','frend','amigo/a']],examples:[['Ana is a teacher.','Ana is a tícher','Ana es profesora.'],['The book is blue.','de buk is blu','El libro es azul.']],exercise:{type:'fill',q:'Traduce al inglés: “libro”',answer:'book',hint:'Tiene cuatro letras.'}},
{icon:'➕',title:'Plural',intro:'Para muchos sustantivos, agrega -s: book → books. Algunos terminan en -es o cambian de forma.',note:'No uses a/an con plurales. Di “books”, no “a books”.',cards:[['book → books','buk → buks','libro → libros'],['car → cars','car → cars','coche → coches'],['box → boxes','boks → bóksis','caja → cajas'],['baby → babies','béibi → béibis','bebé → bebés'],['child → children','chaild → chíldren','niño → niños']],examples:[['They are students.','dei ar stúdents','Ellos son estudiantes.'],['The boxes are big.','de bóksis ar big','Las cajas son grandes.']],exercise:{type:'words',q:'Ordena la frase plural:',words:['are','They','students'],answer:['They','are','students']}},
{icon:'✨',title:'Adjetivos básicos',intro:'Los adjetivos describen: big, small, happy. En inglés van normalmente antes del sustantivo.',note:'A diferencia del español, el adjetivo no cambia: a red car / two red cars.',cards:[['big / small','big / smol','grande / pequeño'],['good / bad','gud / bad','bueno / malo'],['happy / sad','jápi / sad','feliz / triste'],['new / old','niu / ould','nuevo / viejo'],['hot / cold','jot / kould','caliente / frío'],['beautiful','biútiful','bonito/a']],examples:[['It is a big house.','it is a big jaus','Es una casa grande.'],['She is happy.','shi is jápi','Ella está feliz.'],['They are good students.','dei ar gud stúdents','Ellos son buenos estudiantes.']],exercise:{type:'fill',q:'Traduce al inglés: “feliz”',answer:'happy',hint:'Empieza con h.'}}
];
// El progreso validado se guarda por separado: una lección solo se puede completar tras resolver su práctica.
const defaultProfile={name:'Estudiante',createdAt:new Date().toISOString(),correct:0,incorrect:0};
let savedProfile;try{savedProfile=JSON.parse(localStorage.getItem('englishStartProfileV3')||'null')}catch(e){savedProfile=null}
const state={current:0,done:JSON.parse(localStorage.getItem('englishStartDoneV2')||'[]'),passed:JSON.parse(localStorage.getItem('englishStartPassedV2')||'[]'),theme:localStorage.getItem('englishStartTheme')||'light',profile:{...defaultProfile,...(savedProfile||{})}};
document.documentElement.dataset.theme=state.theme;
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function save(){localStorage.setItem('englishStartDoneV2',JSON.stringify(state.done));localStorage.setItem('englishStartPassedV2',JSON.stringify(state.passed));localStorage.setItem('englishStartProfileV3',JSON.stringify(state.profile));localStorage.setItem('englishStartTheme',state.theme);updateProfileBadge()}
function updateProfileBadge(){let el=$('#profileNameNav');if(el)el.textContent=state.profile.name||'Mi perfil'}
function accuracy(){let total=state.profile.correct+state.profile.incorrect;return total?Math.round(state.profile.correct/total*100):0}
function isUnlocked(i){return i===0||state.done.includes(i-1)}
function nav(){ $('#lessonNav').innerHTML=lessons.map((l,i)=>{let unlocked=isUnlocked(i),done=state.done.includes(i);return `<button class="nav-item ${i===state.current?'active':''} ${done?'done':''} ${unlocked?'':'locked'}" onclick="openLesson(${i})"><span class="nav-dot">${done?'✓':unlocked?i+1:'🔒'}</span><span>${l.title}</span></button>`}).join(''); const p=Math.round(state.done.length/lessons.length*100);$('#totalBar').style.width=p+'%';$('#progressLabel').textContent=`${state.done.length} de ${lessons.length}`; }
function cards(l){return `<div class="grid">${l.cards.map(c=>`<div class="mini"><div class="english">${c[0]}</div><div class="pron">🔊 ${c[1]}</div><div class="translation">${c[2]}</div></div>`).join('')}</div>`}
function examples(l){return `<div class="table-wrap"><table class="grammar"><thead><tr><th>Inglés</th><th>Pronunciación</th><th>Español</th></tr></thead><tbody>${l.examples.map(e=>`<tr><td><strong>${e[0]}</strong></td><td>${e[1]}</td><td>${e[2]}</td></tr>`).join('')}</tbody></table></div>`}
function toBeExtra(){return `<div class="card"><h2>Las tres formas de TO BE</h2><div class="table-wrap"><table class="grammar"><thead><tr><th>Persona</th><th>Afirmativa</th><th>Negativa</th><th>Pregunta</th></tr></thead><tbody><tr><td>I</td><td>I am happy.</td><td>I am not sad.</td><td>Am I ready?</td></tr><tr><td>You</td><td>You are here.</td><td>You are not late.</td><td>Are you okay?</td></tr><tr><td>He / She / It</td><td>She is nice.</td><td>He is not here.</td><td>Is it blue?</td></tr><tr><td>We / They</td><td>We are friends.</td><td>They are not students.</td><td>Are we ready?</td></tr></tbody></table></div><h3>Contracciones muy usadas</h3><div class="grid"><div class="mini"><b>I'm</b> = I am</div><div class="mini"><b>You're</b> = You are</div><div class="mini"><b>He's / She's / It's</b> = He / She / It is</div><div class="mini"><b>We're / They're</b> = We / They are</div></div><div class="note" style="margin-top:16px"><b>Ejemplos:</b> I'm Mexican. • You're my teacher. • He's at home. • She's happy. • It's a book. • We're ready. • They're friends.<br><br><b>Negativa:</b> isn't = is not; aren't = are not. Ej.: She isn't sad. We aren't late.</div></div>`}
function exercise(l){let e=l.exercise;let body='';if(e.type==='choice') body=`<div class="options">${e.options.map((o,i)=>`<button class="option" onclick="checkChoice(this,${i},${e.answer},'${esc(e.why)}')">${esc(o)}</button>`).join('')}</div>`;if(e.type==='fill')body=`<div class="input-row"><input id="answer" class="answer-input" autocomplete="off" placeholder="Escribe tu respuesta en inglés"><button class="primary" onclick='checkFill(${JSON.stringify([e.answer,...(e.alternatives||[])] )})'>Comprobar</button></div><div class="pron">Pista: ${e.hint}</div>`;if(e.type==='words')body=`<div class="dropzone" id="dropzone">Toca las palabras en el orden correcto</div><div class="word-bank">${e.words.sort(()=>Math.random()-.5).map(w=>`<button class="word" draggable="true" data-word="${w}" onclick="moveWord(this)">${w}</button>`).join('')}</div><button class="primary" onclick='checkWords(${JSON.stringify(e.answer)})'>Comprobar</button>`;if(e.type==='match')body=`<div class="match-grid"><div>${e.pairs.map((p,i)=>`<button data-side="l" data-id="${i}" onclick="pickMatch(this)">${p[0]}</button>`).join('')}</div><div>${[...e.pairs].sort(()=>Math.random()-.5).map((p,i)=>`<button data-side="r" data-id="${e.pairs.indexOf(p)}" onclick="pickMatch(this)">${p[1]}</button>`).join('')}</div></div>`;return `<div class="card" id="exercise"><div class="exercise-head"><h2>Practica ahora</h2><span class="pill">Ejercicio interactivo</span></div><div class="question">${e.q}</div>${body}<div class="feedback" id="feedback"></div></div>`}
function renderHome(){state.current=null;nav();let next=lessons.findIndex((_,i)=>isUnlocked(i)&&!state.done.includes(i));if(next<0)next=0;let percent=Math.round(state.done.length/lessons.length*100);$('#content').innerHTML=`<section class="home-hero"><div class="home-kicker">ENGLISH START · FOUNDATION TRACK</div><h1>Construye una base sólida en inglés.</h1><p>Un recorrido guiado, profesional y progresivo para hispanohablantes. Completa cada práctica y desbloquea el siguiente bloque.</p><button class="primary" onclick="openLesson(${next})">${state.done.length?'Continuar mi ruta →':'Comenzar la ruta →'}</button></section><div class="stats-grid"><div class="stat"><b>${state.done.length}<small>/${lessons.length}</small></b><span>Lecciones completadas</span></div><div class="stat"><b>${percent}%</b><span>Progreso del programa</span></div><div class="stat"><b>${state.done.length*3}</b><span>Puntos de dominio</span></div></div><div class="home-section"><div><h2>Ruta de aprendizaje</h2><p>Las lecciones se desbloquean una a una.</p></div><span class="pill">Nivel inicial</span></div><div class="course-grid">${lessons.map((l,i)=>{let unlocked=isUnlocked(i),done=state.done.includes(i);return `<button class="course-card" ${unlocked?'':'disabled'} onclick="openLesson(${i})"><div class="course-top"><span class="course-icon">${done?'🏅':l.icon}</span><span class="course-num">MÓDULO ${String(i+1).padStart(2,'0')}</span></div><h3>${l.title}</h3><p>${done?'Dominio validado':unlocked?'Disponible para practicar':'Completa el módulo anterior'}</p><span class="course-status">${done?'✓ COMPLETADO':unlocked?'INICIAR →':'🔒 BLOQUEADO'}</span></button>`}).join('')}</div>`;window.scrollTo({top:0,behavior:'smooth'});}
function renderProfile(){state.current='profile';nav();let total=state.profile.correct+state.profile.incorrect,acc=accuracy(),date=new Date(state.profile.createdAt).toLocaleDateString('es-MX',{month:'short',year:'numeric'}),max=Math.max(state.profile.correct,state.profile.incorrect,1);let achievements=[['🚀','Primer paso','Completa tu primera lección',state.done.length>=1],['🎯','Precisión','Alcanza 80% de aciertos',total>=5&&acc>=80],['🏅','En marcha','Completa 5 lecciones',state.done.length>=5],['💎','Fundamentos','Completa las 15 lecciones',state.done.length===lessons.length]];$('#content').innerHTML=`<section class="profile-header"><div class="profile-identity"><div class="avatar">${esc((state.profile.name||'E').trim().charAt(0).toUpperCase())}</div><div><h1>${esc(state.profile.name||'Estudiante')}</h1><p>Perfil local · desde ${date}</p></div></div><button class="secondary" onclick="renderHome()">← Panel principal</button></section><div class="stats-grid"><div class="stat"><b>${state.done.length}<small>/${lessons.length}</small></b><span>Lecciones validadas</span></div><div class="stat"><b>${acc}%</b><span>Precisión total</span></div><div class="stat"><b>${total}</b><span>Intentos registrados</span></div></div><div class="card"><div class="exercise-head"><h2>Rendimiento</h2><span class="pill">Datos del perfil</span></div><div class="chart" role="img" aria-label="Gráfica de ${state.profile.correct} aciertos y ${state.profile.incorrect} fallos"><div class="bar-group"><div class="bar" style="height:${Math.max(5,Math.round(state.profile.correct/max*100))}%"></div><b>${state.profile.correct}</b><span>Aciertos</span></div><div class="bar-group"><div class="bar error" style="height:${Math.max(5,Math.round(state.profile.incorrect/max*100))}%"></div><b>${state.profile.incorrect}</b><span>Fallos</span></div></div><div class="chart-legend"><span>Precisión: <b>${acc}%</b></span><span>Progreso del curso: <b>${Math.round(state.done.length/lessons.length*100)}%</b></span></div></div><div class="card"><h2>Logros</h2><div class="achievement-grid">${achievements.map(a=>`<div class="achievement ${a[3]?'':'locked'}"><b>${a[0]} ${a[1]}</b><small>${a[2]} ${a[3]?'· conseguido':''}</small></div>`).join('')}</div></div><div class="card"><h2>Configuración del perfil</h2><div class="input-row"><input id="profileNameInput" class="answer-input" maxlength="24" value="${esc(state.profile.name)}" aria-label="Nombre del perfil"><button class="primary" onclick="saveProfileName()">Guardar nombre</button></div><div class="complete-row"><div><b>Eliminar perfil y progreso</b><div class="pron">Borra lecciones, intentos, logros y nombre guardados en este navegador.</div></div><button class="danger" onclick="deleteProfile()">Eliminar mis datos</button></div></div>`;window.scrollTo({top:0,behavior:'smooth'});}
function saveProfileName(){let input=$('#profileNameInput'),name=input.value.trim();if(!name){toast('Escribe un nombre para tu perfil.');return}state.profile.name=name;save();renderProfile();toast('Nombre de perfil actualizado.');}
function deleteProfile(){if(!confirm('¿Eliminar el perfil y todo su progreso? Esta acción no se puede deshacer.'))return;['englishStartDoneV2','englishStartPassedV2','englishStartProfileV3'].forEach(k=>localStorage.removeItem(k));state.done=[];state.passed=[];state.profile={...defaultProfile};save();toast('Perfil y progreso eliminados.');renderHome();}
function render(){let l=lessons[state.current],done=state.done.includes(state.current);$('#content').innerHTML=`<section class="hero"><div><div class="eyebrow">Lección ${state.current+1} de ${lessons.length}</div><h1>${l.title}</h1><p>${l.intro}</p></div><div class="lesson-icon">${l.icon}</div></section><div class="card"><h2>Idea clave</h2><div class="note">${l.note}</div><h3>Palabras y frases</h3>${cards(l)}</div><div class="card"><h2>Ejemplos en contexto</h2>${examples(l)}</div>${l.toBe?toBeExtra():''}${done?`<div class="card complete-row"><div class="badge"><span>🏅</span><div>Lección completada y dominio validado.</div></div>${state.current<lessons.length-1?`<button class="primary" onclick="openLesson(${state.current+1})">Siguiente lección →</button>`:`<button class="primary" onclick="renderHome()">Ver mi progreso</button>`}</div>`:exercise(l)}<div class="complete-row"><button class="secondary" onclick="renderHome()">← Volver al panel</button><span class="progress-label">Completa la práctica para validar este módulo.</span></div>`;nav();window.scrollTo({top:0,behavior:'smooth'});}
function passExercise(){if(!state.passed.includes(state.current)){state.passed.push(state.current);save()}if(!state.done.includes(state.current)){toast('✓ Práctica superada. Validando módulo…');setTimeout(completeLesson,550)}}
function feedback(ok,msg,unlock=ok){state.profile[ok?'correct':'incorrect']++;save();let f=$('#feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✓ ¡Muy bien! ':'↻ Aún no. ')+msg;if(ok){if(unlock)passExercise();$('#exercise').classList.add('celebrate');setTimeout(()=>$('#exercise')?.classList.remove('celebrate'),500)}}
function checkChoice(el,got,answer,why){if(got===answer){document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===answer)b.classList.add('correct')});feedback(true,why);return}el.classList.add('wrong');feedback(false,'No es esa. Inténtalo otra vez.');setTimeout(()=>el.classList.remove('wrong'),500)}
function checkFill(answers){let v=$('#answer').value.trim().toLowerCase(),ok=answers.map(x=>x.toLowerCase()).includes(v);feedback(ok,ok?'¡La respuesta es correcta!':'Inténtalo de nuevo.');}
function moveWord(b){$('#dropzone').appendChild(b)}
function checkWords(answer){let got=[...$('#dropzone').querySelectorAll('.word')].map(x=>x.dataset.word);feedback(got.join('|')===answer.join('|'),got.join('|')===answer.join('|')?'¡Oración perfecta!':'Revisa el orden: primero el sujeto, después el verbo.')}
// También permite arrastrar palabras en equipos con ratón; tocar sigue funcionando en móviles.
let draggingWord=null;
document.addEventListener('dragstart',e=>{if(e.target.matches('.word')){draggingWord=e.target;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest('.dropzone')){e.preventDefault();e.target.closest('.dropzone').classList.add('dragover')}});
document.addEventListener('dragleave',e=>e.target.closest?.('.dropzone')?.classList.remove('dragover'));
document.addEventListener('drop',e=>{let zone=e.target.closest('.dropzone');if(zone&&draggingWord){e.preventDefault();zone.appendChild(draggingWord);zone.classList.remove('dragover');draggingWord=null}});
let selected=null;function pickMatch(b){if(b.classList.contains('matched'))return;if(!selected){selected=b;b.classList.add('selected');return}if(selected.dataset.side===b.dataset.side){selected.classList.remove('selected');selected=b;b.classList.add('selected');return}let ok=selected.dataset.id===b.dataset.id;selected.classList.remove('selected');if(ok){selected.classList.add('matched');b.classList.add('matched');let finished=document.querySelectorAll('.match-grid .matched').length===lessons[state.current].exercise.pairs.length*2;feedback(true,'¡Relacionaste correctamente!'+(finished?' Terminaste todas las relaciones.':''),finished)}else feedback(false,'Esa pareja no corresponde. Prueba otra vez.');selected=null}
function completeLesson(){if(!state.passed.includes(state.current)||state.done.includes(state.current))return;state.done.push(state.current);save();toast('🏅 Módulo completado. Siguiente lección desbloqueada.');render();}
function openLesson(i){if(!isUnlocked(i)){toast('🔒 Completa el módulo anterior para continuar.');return}state.current=i;render();$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open')}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2600)}
$('#brandHome').onclick=renderHome;$('#profileBtn').onclick=()=>{renderProfile();$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open')};$('#themeBtn').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;save()};$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#backdrop').classList.add('open')};$('#backdrop').onclick=()=>{ $('#sidebar').classList.remove('open');$('#backdrop').classList.remove('open')};
updateProfileBadge();renderHome();
</script>
</body>
</html>
